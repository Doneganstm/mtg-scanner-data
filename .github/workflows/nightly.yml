# Rebuilds cards.db every night (new sets + fresh prices) and publishes it as the newest release.
# The app downloads .../releases/latest/download/cards.db
name: Nightly card database
on:
  schedule: [{ cron: '30 10 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: nightly
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/cache@v4
        with:
          path: tools/cache/small
          key: card-art-${{ github.run_id }}
          restore-keys: card-art-
      - run: npm ci
        working-directory: tools
      - run: node --no-warnings build-index.ts --concurrency 16
        working-directory: tools
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="db-$(date -u +%F)"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" tools/out/cards.db --title "Card database $(date -u +%F)" \
            --notes "English paper printings with Scryfall prices as of $(date -u +%F). Card data and images (c) Wizards of the Coast, via Scryfall."
          # keep the 7 newest releases
          gh release list --limit 100 --json tagName --jq '.[].tagName' | sort -r | tail -n +8 | xargs -r -I{} gh release delete {} --yes --cleanup-tag
